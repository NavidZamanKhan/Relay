name: relay
description: A high-fidelity, backend-free messaging experience prototype.
publish_to: none
version: 0.3.0+3

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  intl: ^0.20.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
